    <main class="trivia">
        
		<h2>Juego de trivia</h2>
		<h3>¡Demostrá cuanto sabés!</h3>
		
	<div class="juego">
    <!-- Seccion para capturar nombre del jugador -->
    <div id="pantalla-registro">
        <p>Ingresá tu nombre para comenzar:</p> 
        <input type="text" id="input-nombre" placeholder="Tu nombre" />
        <button id="btn-comenzar" type="button">Comenzar Trivia</button>
    </div>




    <!-- Al infresar el nombre comienza el juego -->
    <div id="pantalla-juego" style="display: none;">
        <p>Jugador: <strong id="mostrar-nombre"></strong> | Puntaje: <strong id="mostrar-puntaje">0</strong></p>
        <p id="estado" class="gris">Cargando pregunta...</p> <!-- para el estado de la conexion con la api -->
        <p id="pregunta"></p> <!--  -->
        <div id="opciones"></div>
        <p id="resultado" class="resultado"></p>
        <button id="nueva" type="button" hidden>Siguiente Pregunta</button>
        <button id="btn-finalizar" type="button" hidden>Guardar y Ver Puntajes</button>
    </div>
</div>
