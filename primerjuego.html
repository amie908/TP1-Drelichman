    <title>Primer juego</title>

    <link rel="stylesheet" href="css/estilo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>

<body>

    <header>
        <h1 class="headertitulo">Juegos</h1> <!--Nombre general del sitio-->
    </header>

    <nav>
        <a href="index.html">Inicio</a> 
        <a href="primerjuego.html">Trivia</a>
        <a href="segundojuego.html">Carrera</a>

        <a href="puntajes.html">Puntajes</a>
        <a href="proyecto.html">Proyecto</a>
    </nav>


    <main class="trivia">
        <section class="trivia-panel">
            <div class="trivia-presentacion">
                <span class="trivia-etiqueta">Trivia de verdadero o falso</span>
                <h2>Juego de trivia</h2>
                <h3>¡Demostrá cuánto sabés!</h3>
            </div>

            <div id="pantalla-registro">
                <p>Ingresá tu nombre para comenzar:</p>
                <input type="text" id="input-nombre" placeholder="Tu nombre">
                <button id="btn-comenzar" type="button">Comenzar Trivia</button>
            </div>

            <div id="pantalla-juego" class="pantalla-juego">
                <p>Jugador: <strong id="mostrar-nombre"></strong> | Puntaje: <strong id="mostrar-puntaje">0</strong></p>

                <div class="trivia-pregunta-recuadro">
                    <p id="estado">Cargando pregunta...</p>
                    <p id="pregunta" class="trivia-texto-pregunta"></p>
                    <div id="opciones" class="trivia-opciones"></div>
                    <p id="resultado" class="trivia-resultado"></p>
                    <button id="nueva" class="trivia-nueva" type="button" hidden>Siguiente pregunta</button>
                    <button id="btn-finalizar" type="button" hidden>Guardar y ver puntajes</button>
                </div>
            </div>
        </section>

        <p class="trivia-volver"><a href="index.html" class="volver">» Volver al inicio «</a></p>
    </main>

   <footer>

        <p>
            Trabajo Práctico N°1 - Informática General Cátedra Drelichman 
        </p>

    </footer>
	
	<script src="js/juego1.js"></script>
	
</body>

</html>
